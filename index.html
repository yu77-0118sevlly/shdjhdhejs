<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 强制全屏，禁止用户缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f5f5f5">
    
    <!-- 桌面图标 -->
    <link rel="apple-touch-icon" href="https://img2.tofaka.com/autoupload/fr/46dIX_KX_ZeooqP6vYUelshcUxUpTKAOrZDhOSVlJuGyl5f0KlZfm6UsKj-HyTuv/20260824/TIlW/1242X1215/IMG_1432.jpeg">
    <link rel="icon" type="image/jpeg" href="https://img2.tofaka.com/autoupload/fr/46dIX_KX_ZeooqP6vYUelshcUxUpTKAOrZDhOSVlJuGyl5f0KlZfm6UsKj-HyTuv/20260824/TIlW/1242X1215/IMG_1432.jpeg">
    
    <title>支付宝</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* 严格使用原生 iOS 字体以贴合原图 */
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        /* 核心：彻底锁死页面，禁止任何形式的上下滑动 */
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #f5f5f5;
            touch-action: none; /* 彻底禁止手势滑动 */
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
            user-select: none;
        }

        .container {
            width: 100%;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航栏 - 极限压缩高度以适配全屏 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: max(10px, env(safe-area-inset-top)) 16px 10px 16px;
            background-color: #f5f5f5;
            font-size: 17px;
            font-weight: 500;
            color: #000;
        }

        .header .back-placeholder {
            width: 40px;
        }

        .header .title {
            flex: 1;
            text-align: center;
        }

        .header .action {
            width: 40px;
            text-align: right;
            color: #1677ff; 
            font-size: 15px;
            font-weight: 400;
        }

        /* 卡片区域 - 缩小边距和间距 */
        .card {
            background-color: #fff;
            border-radius: 10px;
            margin: 0 12px 8px 12px; /* 缩小底部间距 */
            overflow: hidden;
        }

        /* 提示文字 */
        .section-note {
            padding: 2px 16px 6px 16px;
            font-size: 12px;
            color: #999;
        }

        /* 列表行 - 统一高度，确保所有内容刚好塞满一屏 */
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 44px; /* 固定行高，防止撑开 */
            padding: 0 16px;
            position: relative;
        }

        .row.clickable:active {
            background-color: #f0f0f0;
        }

        .row:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 16px;
            right: 0;
            bottom: 0;
            height: 1px;
            background-color: #e5e5ea;
            transform: scaleY(0.5);
        }

        /* 左侧文字字体颜色 */
        .row-left {
            font-size: 16px;
            color: #111;
        }

        /* 右侧文字字体颜色 */
        .row-right {
            display: flex;
            align-items: center;
            font-size: 15px;
            color: #999;
        }

        /* 头像 */
        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 4px;
            background-color: #ddd;
            object-fit: cover;
        }

        /* 箭头指示器 - 仿 iOS 原生更细的线条 */
        .has-arrow::after {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-top: 1.5px solid #c7c7cc;
            border-right: 1.5px solid #c7c7cc;
            transform: rotate(45deg);
            margin-left: 8px;
        }

        /* 二维码小图标 */
        .qr-icon {
            display: flex;
            flex-wrap: wrap;
            width: 14px;
            height: 14px;
            justify-content: space-between;
            align-content: space-between;
        }
        .qr-icon span {
            width: 6px;
            height: 6px;
            border: 1.5px solid #999;
            border-radius: 1.5px;
        }

        /* iOS 风格 Switch 开关 - 按比例缩小以贴合紧凑布局 */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #fff;
            border: 1.5px solid #e5e5ea;
            transition: .3s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 24px;
            width: 24px;
            left: 1px;
            bottom: 0.5px;
            background-color: #fff;
            transition: .3s;
            border-radius: 50%;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15), 0 1px 1px rgba(0,0,0,0.16), 0 3px 1px rgba(0,0,0,0.1);
        }

        input:checked + .slider {
            background-color: #1677ff; 
            border-color: #1677ff;
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        /* 原生输入框样式 - 隐形化 */
        .inline-input {
            border: none;
            background: transparent;
            text-align: right;
            font-size: 15px;
            color: #999;
            outline: none;
            width: 40px;
            font-family: inherit;
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="back-placeholder"></div>
        <div class="title">个人资料</div>
        <div class="action">隐私</div>
    </div>

    <!-- 基础信息卡片 -->
    <div class="card">
        <div class="row clickable" id="avatarRow">
            <div class="row-left">头像</div>
            <div class="row-right has-arrow">
                <!-- 默认预留原图头像位置，点击可换 -->
                <img src="https://via.placeholder.com/40" alt="avatar" class="avatar" id="avatarImg">
            </div>
        </div>
        <input type="file" id="avatarInput" accept="image/*" style="display: none;">

        <div class="row">
            <div class="row-left">我的二维码</div>
            <div class="row-right has-arrow">
                <div class="qr-icon">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="row-left">昵称</div>
            <div class="row-right has-arrow">u</div>
        </div>
        <div class="row">
            <div class="row-left">性别</div>
            <div class="row-right">女</div>
        </div>
        <div class="row">
            <div class="row-left">地区</div>
            <div class="row-right has-arrow">上海 浦东新区</div>
        </div>
        <div class="row">
            <div class="row-left">个性签名</div>
            <div class="row-right has-arrow">我的心可不冷</div>
        </div>
    </div>

    <!-- 年龄信息卡片 -->
    <div class="section-note">年龄来自支付宝实名信息，仅用作展示，关闭后将不会公开</div>
    <div class="card">
        <div class="row">
            <div class="row-left">公开我的年龄</div>
            <div class="row-right">
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div class="row clickable" id="ageRow">
            <div class="row-left">年龄</div>
            <div class="row-right">
                <input type="number" id="ageInput" value="23" class="inline-input">
            </div>
        </div>
    </div>

    <!-- 其他信息卡片 -->
    <div class="section-note">以下信息填写后，将会公开展示</div>
    <div class="card">
        <div class="row">
            <div class="row-left">职业</div>
            <div class="row-right has-arrow">未填写</div>
        </div>
        <div class="row">
            <div class="row-left">收入</div>
            <div class="row-right has-arrow">未填写</div>
        </div>
        <div class="row">
            <div class="row-left">兴趣爱好</div>
            <div class="row-right has-arrow">未填写</div>
        </div>
    </div>

    <!-- 动态管理卡片 -->
    <div class="section-note">管理我在个人信息页展示的动态内容</div>
    <div class="card">
        <div class="row">
            <div class="row-left">公开我的动态</div>
            <div class="row-right">
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div class="row">
            <div class="row-left">朋友动态开关</div>
            <div class="row-right">
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div class="row">
            <div class="row-left">生活号开关</div>
            <div class="row-right">
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>
</div>

<script>
    // --- 禁止双指缩放和双击缩放 (增强防误触) ---
    document.addEventListener('touchstart', function(event) {
        if (event.touches.length > 1) {
            event.preventDefault();
        }
    }, { passive: false });
    
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(event) {
        let now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }
        lastTouchEnd = now;
    }, false);

    // --- 更换头像逻辑 ---
    const avatarRow = document.getElementById('avatarRow');
    const avatarInput = document.getElementById('avatarInput');
    const avatarImg = document.getElementById('avatarImg');

    avatarRow.addEventListener('click', function() {
        avatarInput.click();
    });

    avatarInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                avatarImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    // --- 修改年龄逻辑 ---
    const ageRow = document.getElementById('ageRow');
    const ageInput = document.getElementById('ageInput');

    ageRow.addEventListener('click', function(e) {
        ageInput.focus();
    });
</script>
</body>
</html>
